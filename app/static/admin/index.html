<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beauty Outreach · 触达指挥台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-root"></div>

  <div id="app" class="app hidden">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark">BO</span>
        <div class="brand-copy">
          <strong>Beauty Outreach</strong>
          <span>触达指挥台</span>
        </div>
      </div>

      <nav id="side-nav" class="side-nav" aria-label="主导航"></nav>

      <div class="rail-foot">
        <button id="wizard-button" class="rail-action" type="button">
          <span class="wizard-mark">◎</span>
          <span class="nav-label">演示向导</span>
        </button>
        <div id="system-status" class="system-status">
          <span class="dot tone-muted"></span><span>正在检查系统…</span>
        </div>
        <p class="rail-note">Mock 沙箱<br>不连接真实平台</p>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-copy">
          <h1 id="page-title">驾驶舱</h1>
          <p id="page-subtitle">先看整体，再决定下一步做什么</p>
        </div>
        <div class="topbar-actions">
          <button id="palette-button" class="palette-button" type="button" title="快速跳转">
            <span class="palette-key">⌘</span>
            <span>搜索 / 跳转</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button id="compliance-chip" class="compliance-chip" type="button" title="查看演示环境说明"></button>
          <button id="operator-button" class="operator" type="button" title="操作人与访问口令"></button>
        </div>
      </header>

      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>
    <p class="noscript">这个控制台需要启用 JavaScript 才能运行。</p>
  </noscript>

  <script type="module" src="app/main.js"></script>
</body>
</html>
